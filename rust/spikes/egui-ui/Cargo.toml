# UI-Spike mit egui/eframe (MIT OR Apache-2.0): Gegenstück zum Slint-Spike, passend zu Apache 2.0.
# Eigenständiger Workspace; wird nicht mit der Anwendung gebaut oder verteilt.
[package]
name = "egui-ui-spike"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "accesskit", "x11", "wayland"] }
egui_extras = "0.37"
png = "0.17"
rfd = "0.15"
