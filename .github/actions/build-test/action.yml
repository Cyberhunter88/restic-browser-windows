name: Build and test
description: Build the Rust workspace in release mode and run all tests with the pinned Restic.
runs:
  using: composite
  steps:
    - name: Build release
      shell: bash
      working-directory: rust
      run: cargo build --workspace --release --locked
    - name: Run tests
      shell: bash
      working-directory: rust
      env:
        RESTIC_BROWSER_REQUIRE_RESTIC: "1"
      run: cargo test --workspace --release --locked
