name: Build and test
description: Build the Release solution and execute its test runner.
runs:
  using: composite
  steps:
    - name: Build release
      shell: pwsh
      run: dotnet build ResticBrowser.slnx -c Release --no-restore
    - name: Run tests
      shell: pwsh
      run: dotnet run --project tests/ResticBrowser.Tests/ResticBrowser.Tests.csproj -c Release --no-build
