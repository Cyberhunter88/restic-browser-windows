name: Install Restic
description: Install the pinned, checksum-verified Restic executable for tests.
runs:
  using: composite
  steps:
  - name: Install GnuPG for release signature checks
    if: runner.os == 'Windows'
    shell: pwsh
    run: |
      if (-not (Get-Command gpg -ErrorAction SilentlyContinue)) { choco install gnupg --no-progress --yes }
  - name: Prepare signed Restic for integration tests
    shell: pwsh
    run: |
      $root = Join-Path $env:RUNNER_TEMP "restic"
      New-Item -ItemType Directory -Path $root -Force | Out-Null
      if ($IsWindows) {
          $binName = "restic.exe"
          $platform = "windows"
      } else {
          $binName = "restic"
          $platform = "linux"
      }
      $restic = Join-Path $root $binName
      ./scripts/prepare-restic.ps1 -Platform $platform -Destination $restic
      "RESTIC_BROWSER_TEST_RESTIC=$restic" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      if (-not $IsWindows) { "RESTIC_BROWSER_SSH_E2E_RESTIC=$restic" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append }
      if ($IsWindows) {
          $gitGpg = Join-Path ${env:ProgramFiles} "Git\usr\bin"
          if (Test-Path (Join-Path $gitGpg "gpg.exe")) {
              $gitGpg | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      }
