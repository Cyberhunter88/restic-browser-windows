name: Prepare Rust
description: Install the stable Rust toolchain and cache cargo downloads and dependency build output.
inputs:
  tools:
    description: Space separated cargo tools to install (for example cargo-audit cargo-deny).
    required: false
    default: ''
runs:
  using: composite
  steps:
  - name: Install Rust toolchain
    shell: bash
    run: |
      rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      rustup default stable
      rustc --version

  # Kleinere Build-Ausgabe in der CI: keine inkrementellen Daten, Debug-Informationen nur als
  # Zeilentabellen (Backtraces behalten Datei und Zeile). Release und dist bleiben unverändert.
  - name: Reduce build output size
    shell: bash
    run: |
      {
        echo "CARGO_INCREMENTAL=0"
        echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only"
        echo "CARGO_PROFILE_TEST_DEBUG=line-tables-only"
      } >> "$GITHUB_ENV"

  # Der Cache wird nur auf main gespeichert; Pull Requests (auch von Dependabot) lesen ihn nur.
  # rust-cache legt je Job und Plattform einen Eintrag an, entfernt vor dem Speichern die
  # Artefakte der eigenen Workspace-Crates und behält nur die Abhängigkeiten.
  - name: Restore cargo cache
    uses: Swatinem/rust-cache@v2
    with:
      save-if: ${{ github.ref == 'refs/heads/main' }}

  - name: Install cargo tools
    if: inputs.tools != ''
    shell: bash
    run: cargo install --locked ${{ inputs.tools }}
