name: Build and release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Create or update draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Require main for manual runs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5, verified from the official tag
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  version:
    name: Read and validate version.txt
    if: needs.release-please.outputs.release_created == 'true'
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Checkout exact generated tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - id: version
        name: Read version.txt and validate tag ancestry
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          $version = (Get-Content -LiteralPath "version.txt" -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "version.txt enthält keine semantische MAJOR.MINOR.PATCH-Version: '$version'."
          }
          if ($env:RELEASE_TAG -ne "v$version") {
              throw "Tag '$env:RELEASE_TAG' stimmt nicht mit version.txt 'v$version' überein."
          }
          git fetch origin main --no-tags
          $tagSha = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tagSha)) {
              throw "Der erzeugte Tag '$env:RELEASE_TAG' konnte nicht aufgelöst werden."
          }
          git merge-base --is-ancestor $tagSha origin/main
          if ($LASTEXITCODE -ne 0) {
              throw "Release-Commit '$tagSha' stammt nicht von origin/main ab."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag_name=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT

  build-windows:
    name: Build Windows release
    if: needs.release-please.outputs.release_created == 'true'
    needs: [release-please, version]
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag_name }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout exact generated tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag_name }}
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore NuGet package cache
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.sln', '**/*.slnx', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore ResticBrowser.slnx

      - name: Verify version.txt and tag
        shell: pwsh
        run: ./scripts/verify-version.ps1 -Tag $env:RELEASE_TAG

      - name: Check translation resources
        shell: pwsh
        run: ./scripts/verify-translations.ps1

      - name: Check C# code formatting
        shell: pwsh
        run: dotnet format --verify-no-changes

      - name: Check package vulnerabilities
        shell: pwsh
        run: dotnet list ResticBrowser.slnx package --vulnerable --include-transitive

      - name: Build release
        shell: pwsh
        run: dotnet build ResticBrowser.slnx -c Release --no-restore

      - name: Run tests
        shell: pwsh
        run: dotnet run --project tests/ResticBrowser.Tests/ResticBrowser.Tests.csproj -c Release --no-build

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build portable executable and installer
        shell: pwsh
        run: ./scripts/publish-windows-installer.ps1 -Configuration Release

      - name: Prepare Windows release archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "windows-package","release-assets" -Force | Out-Null
          Copy-Item -LiteralPath "dist/ResticBrowser.exe","LICENSE","README.md" -Destination "windows-package"
          Compress-Archive -Path "windows-package/*" -DestinationPath "release-assets/ResticBrowserWindows-$env:RELEASE_VERSION-win-x64.zip" -CompressionLevel Optimal
          Copy-Item -LiteralPath "dist/ResticBrowser.exe","dist/ResticBrowser-Setup.exe" -Destination "release-assets"

      - name: Verify Windows release assets
        shell: pwsh
        run: |
          ./scripts/verify-version.ps1 -Tag $env:RELEASE_TAG -ExecutablePath "release-assets/ResticBrowser.exe"
          ./scripts/verify-release-artifacts.ps1 -Directory release-assets -Version $env:RELEASE_VERSION -Platform Windows -RequireInstaller

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ needs.version.outputs.version }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Build Linux release
    if: needs.release-please.outputs.release_created == 'true'
    needs: [release-please, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag_name }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout exact generated tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag_name }}
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore NuGet package cache
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.sln', '**/*.slnx', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore ResticBrowser.slnx

      - name: Install Linux desktop dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y bzip2 libegl1 libgbm1 libgl1 libgl1-mesa-dri libinput10 xvfb

      - name: Install Restic for integration tests
        shell: pwsh
        run: |
          $version = "0.19.1"
          $asset = "restic_${version}_linux_amd64.bz2"
          $root = Join-Path $env:RUNNER_TEMP "restic"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Invoke-WebRequest -Uri "https://github.com/restic/restic/releases/download/v$version/$asset" -OutFile (Join-Path $root $asset)
          Invoke-WebRequest -Uri "https://github.com/restic/restic/releases/download/v$version/SHA256SUMS" -OutFile (Join-Path $root "SHA256SUMS")
          $expected = (((Select-String -Path (Join-Path $root "SHA256SUMS") -Pattern ([regex]::Escape($asset)) | Select-Object -First 1).Line) -split '\s+')[0]
          $actual = (Get-FileHash (Join-Path $root $asset) -Algorithm SHA256).Hash
          if (-not $expected -or $actual -ne $expected) { throw "Restic archive checksum verification failed." }
          bzip2 -d (Join-Path $root $asset)
          Copy-Item (Join-Path $root "restic_${version}_linux_amd64") (Join-Path $root "restic")
          chmod +x (Join-Path $root "restic")
          $root | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify version.txt and tag
        shell: pwsh
        run: ./scripts/verify-version.ps1 -Tag $env:RELEASE_TAG

      - name: Check translation resources
        shell: pwsh
        run: ./scripts/verify-translations.ps1

      - name: Check C# code formatting
        shell: pwsh
        run: dotnet format --verify-no-changes

      - name: Check package vulnerabilities
        shell: pwsh
        run: dotnet list ResticBrowser.slnx package --vulnerable --include-transitive

      - name: Build release
        shell: pwsh
        run: dotnet build ResticBrowser.slnx -c Release --no-restore

      - name: Run tests
        shell: pwsh
        run: dotnet run --project tests/ResticBrowser.Tests/ResticBrowser.Tests.csproj -c Release --no-build

      - name: Publish Linux x64 executable and package tarball
        shell: bash
        run: |
          set -euo pipefail
          chmod 755 ./scripts/publish-linux.sh
          ./scripts/publish-linux.sh Release
          mkdir -p release-assets
          cp dist/ResticBrowser-linux-x64.tar.gz release-assets/

      - name: Verify Linux release archive and GUI startup
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -File ./scripts/verify-release-artifacts.ps1 -Directory release-assets -Version "$RELEASE_VERSION" -Platform Linux
          extracted="$(mktemp -d)"
          trap 'rm -rf "$extracted"' EXIT
          tar -xzf dist/ResticBrowser-linux-x64.tar.gz -C "$extracted"
          test -x "$extracted/ResticBrowser"
          set +e
          timeout --signal=TERM --kill-after=5s 15s xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" "$extracted/ResticBrowser" >"$extracted/startup.log" 2>&1
          exit_code=$?
          set -e
          if [ "$exit_code" -ne 124 ]; then
            cat "$extracted/startup.log"
            echo "Die Linux-Release-Anwendung ist beim GUI-Start unerwartet beendet worden (Exitcode $exit_code)." >&2
            exit 1
          fi

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-${{ needs.version.outputs.version }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Upload and publish release
    if: needs.release-please.outputs.release_created == 'true'
    needs: [release-please, version, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.version.outputs.tag_name }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout exact generated tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag_name }}
          fetch-depth: 0

      - name: Download Windows release assets
        uses: actions/download-artifact@v4
        with:
          pattern: windows-release-*
          path: release-assets
          merge-multiple: true

      - name: Download Linux release assets
        uses: actions/download-artifact@v4
        with:
          pattern: linux-release-*
          path: release-assets
          merge-multiple: true

      - name: Record checksums and verify complete local asset set
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath release-assets -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content -LiteralPath release-assets/SHA256SUMS.txt -Encoding utf8
          ./scripts/verify-release-artifacts.ps1 -Directory release-assets -Version $env:RELEASE_VERSION -Platform All -AllowChecksumFile

      - name: Confirm draft release before upload
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = "true"

      - name: Upload all complete assets to draft release
        shell: bash
        run: gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" release-assets/* --clobber

      - name: Verify exact remote draft assets
        shell: pwsh
        run: ./scripts/verify-remote-release.ps1 -Tag $env:RELEASE_TAG -Directory release-assets -RequireDraft

      - name: Publish only after all checks passed
        shell: bash
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.id')"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=false -F prerelease=false -f make_latest=true

      - name: Verify exact remote published assets
        shell: pwsh
        run: ./scripts/verify-remote-release.ps1 -Tag $env:RELEASE_TAG -Directory release-assets -RequirePublished
