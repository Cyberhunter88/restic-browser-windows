name: Build and release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - version.txt

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Validate version.txt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Require main for manual runs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Checkout merge commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - id: version
        name: Read and validate version.txt
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath "version.txt" -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "version.txt enthält keine semantische MAJOR.MINOR.PATCH-Version: '$version'."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag_name=v$version" >> $env:GITHUB_OUTPUT

  build-windows:
    name: Build Windows release
    needs: version
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag_name }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore NuGet package cache
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.sln', '**/*.slnx', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore ResticBrowser.slnx

      - name: Install Restic for integration tests
        shell: pwsh
        run: |
          $version = "0.19.1"
          $asset = "restic_$($version)_windows_amd64.zip"
          $root = Join-Path $env:RUNNER_TEMP "restic"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $archivePath = Join-Path $root $asset
          Invoke-WebRequest -Uri "https://github.com/restic/restic/releases/download/v$version/$asset" -OutFile $archivePath
          Invoke-WebRequest -Uri "https://github.com/restic/restic/releases/download/v$version/SHA256SUMS" -OutFile (Join-Path $root "SHA256SUMS")
          $expected = (((Select-String -Path (Join-Path $root "SHA256SUMS") -Pattern ([regex]::Escape($asset)) | Select-Object -First 1).Line) -split '\s+')[0]
          $actual = (Get-FileHash $archivePath -Algorithm SHA256).Hash
          if (-not $expected -or $actual -ne $expected) { throw "Restic archive checksum verification failed." }
          Expand-Archive -LiteralPath $archivePath -DestinationPath $root -Force
          Copy-Item (Join-Path $root "restic_$($version)_windows_amd64.exe") (Join-Path $root "restic.exe")
          $root | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify version and translation resources
        shell: pwsh
        run: |
          ./scripts/verify-version.ps1 -Tag $env:RELEASE_TAG
          ./scripts/verify-translations.ps1

      - name: Check formatting and package vulnerabilities
        shell: pwsh
        run: |
          dotnet format --verify-no-changes
          dotnet list ResticBrowser.slnx package --vulnerable --include-transitive

      - name: Build and test
        shell: pwsh
        run: |
          dotnet build ResticBrowser.slnx -c Release --no-restore
          dotnet run --project tests/ResticBrowser.Tests/ResticBrowser.Tests.csproj -c Release --no-build

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build portable executable and installer
        shell: pwsh
        run: ./scripts/publish-windows-installer.ps1 -Configuration Release

      - name: Prepare Windows release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "windows-package","release-assets" -Force | Out-Null
          Copy-Item -LiteralPath "dist/ResticBrowser.exe","LICENSE","README.md" -Destination "windows-package"
          Compress-Archive -Path "windows-package/*" -DestinationPath "release-assets/ResticBrowserWindows-$env:RELEASE_VERSION-win-x64.zip" -CompressionLevel Optimal
          Copy-Item -LiteralPath "dist/ResticBrowser.exe","dist/ResticBrowser-Setup.exe" -Destination "release-assets"

      - name: Verify Windows release assets
        shell: pwsh
        run: |
          ./scripts/verify-version.ps1 -Tag $env:RELEASE_TAG -ExecutablePath "release-assets/ResticBrowser.exe"
          ./scripts/verify-release-artifacts.ps1 -Directory release-assets -Version $env:RELEASE_VERSION -Platform Windows -RequireInstaller

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ needs.version.outputs.version }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Build Linux release
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag_name }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore NuGet package cache
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.sln', '**/*.slnx', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore ResticBrowser.slnx

      - name: Install Linux CI dependencies
        shell: bash
        timeout-minutes: 5
        run: bash ./scripts/install-linux-ci-dependencies.sh

      - name: Install Restic for integration tests
        shell: pwsh
        run: |
          $version = "0.19.1"
          $asset = "restic_$($version)_linux_amd64.bz2"
          $root = Join-Path $env:RUNNER_TEMP "restic"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $archivePath = Join-Path $root $asset
          Invoke-WebRequest -Uri "https://github.com/restic/restic/releases/download/v$version/$asset" -OutFile $archivePath
          Invoke-WebRequest -Uri "https://github.com/restic/restic/releases/download/v$version/SHA256SUMS" -OutFile (Join-Path $root "SHA256SUMS")
          $expected = (((Select-String -Path (Join-Path $root "SHA256SUMS") -Pattern ([regex]::Escape($asset)) | Select-Object -First 1).Line) -split '\s+')[0]
          $actual = (Get-FileHash $archivePath -Algorithm SHA256).Hash
          if (-not $expected -or $actual -ne $expected) { throw "Restic archive checksum verification failed." }
          bzip2 -d $archivePath
          Copy-Item (Join-Path $root "restic_$($version)_linux_amd64") (Join-Path $root "restic")
          chmod +x (Join-Path $root "restic")
          $root | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify version and translation resources
        shell: pwsh
        run: |
          ./scripts/verify-version.ps1 -Tag $env:RELEASE_TAG
          ./scripts/verify-translations.ps1

      - name: Check formatting and package vulnerabilities
        shell: pwsh
        run: |
          dotnet format --verify-no-changes
          dotnet list ResticBrowser.slnx package --vulnerable --include-transitive

      - name: Build and test
        shell: pwsh
        run: |
          dotnet build ResticBrowser.slnx -c Release --no-restore
          dotnet run --project tests/ResticBrowser.Tests/ResticBrowser.Tests.csproj -c Release --no-build

      - name: Publish Linux x64 executable and package tarball
        shell: bash
        run: |
          set -euo pipefail
          chmod 755 ./scripts/publish-linux.sh
          ./scripts/publish-linux.sh Release
          mkdir -p release-assets
          cp dist/ResticBrowser-linux-x64.tar.gz release-assets/

      - name: Verify Linux release archive and GUI startup
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -File ./scripts/verify-release-artifacts.ps1 -Directory release-assets -Version "$RELEASE_VERSION" -Platform Linux
          extracted="$(mktemp -d)"
          trap 'rm -rf "$extracted"' EXIT
          tar -xzf dist/ResticBrowser-linux-x64.tar.gz -C "$extracted"
          test -x "$extracted/ResticBrowser"
          set +e
          timeout --signal=TERM --kill-after=5s 15s xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" "$extracted/ResticBrowser" >"$extracted/startup.log" 2>&1
          exit_code=$?
          set -e
          if [ "$exit_code" -ne 124 ]; then
            cat "$extracted/startup.log"
            echo "Die Linux-Release-Anwendung ist beim GUI-Start unerwartet beendet worden (Exitcode $exit_code)." >&2
            exit 1
          fi

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-${{ needs.version.outputs.version }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Tag and publish release
    needs: [version, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.version.outputs.tag_name }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download Windows release assets
        uses: actions/download-artifact@v4
        with:
          name: windows-release-${{ needs.version.outputs.version }}
          path: release-assets

      - name: Download Linux release assets
        uses: actions/download-artifact@v4
        with:
          name: linux-release-${{ needs.version.outputs.version }}
          path: release-assets

      - name: Create checksums and verify complete local asset set
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath release-assets -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content -LiteralPath release-assets/SHA256SUMS.txt -Encoding utf8
          ./scripts/verify-release-artifacts.ps1 -Directory release-assets -Version $env:RELEASE_VERSION -Platform All -AllowChecksumFile -SkipWindowsExecutableVersionCheck

      - name: Create or verify exact release tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags --force
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "$RELEASE_TAG^{commit}")"
            if [ "$tag_sha" != "$RELEASE_SHA" ]; then
              echo "Tag $RELEASE_TAG zeigt auf $tag_sha statt auf $RELEASE_SHA." >&2
              exit 1
            fi
            echo "Tag $RELEASE_TAG zeigt bereits auf den geprüften Merge-Commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$RELEASE_TAG" "$RELEASE_SHA" --message "Restic Browser $RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi

      - name: Create or resume published GitHub release
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets 2>/dev/null || true)"
          if [ -z "$release_json" ]; then
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Restic Browser $RELEASE_TAG" \
              --generate-notes \
              --latest
            exit 0
          fi

          is_draft="$(printf '%s' "$release_json" | jq -r '.isDraft')"
          is_prerelease="$(printf '%s' "$release_json" | jq -r '.isPrerelease')"
          if [ "$is_prerelease" = "true" ]; then
            echo "Der vorhandene Release $RELEASE_TAG ist unerwartet ein Pre-Release." >&2
            exit 1
          fi
          if [ "$is_draft" = "true" ]; then
            shopt -s nullglob
            assets_to_upload=()
            for local_asset in release-assets/*; do
              asset_name="$(basename "$local_asset")"
              if ! printf '%s' "$release_json" | jq -e --arg name "$asset_name" \
                'any(.assets[]?; .name == $name)' >/dev/null; then
                assets_to_upload+=("$local_asset")
              fi
            done
            if [ "${#assets_to_upload[@]}" -gt 0 ]; then
              gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${assets_to_upload[@]}"
            fi
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          else
            echo "Der Release $RELEASE_TAG ist bereits veröffentlicht; die Remote-Prüfung entscheidet über die Wiederholung."
          fi

      - name: Verify exact published release remotely
        shell: pwsh
        run: ./scripts/verify-remote-release.ps1 -Tag $env:RELEASE_TAG -Directory release-assets -RequirePublished
