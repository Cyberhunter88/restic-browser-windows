name: Build and release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Directory.Build.props

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Validate product version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - name: Require main for manual runs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Checkout merge commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - id: version
        name: Detect product version change
        shell: pwsh
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_BEFORE: ${{ github.event.before }}
        run: |
          $release = ./scripts/get-release-version.ps1 -EventName $env:RELEASE_EVENT -Before $env:RELEASE_BEFORE
          "version=$($release.Version)" >> $env:GITHUB_OUTPUT
          "tag_name=$($release.Tag)" >> $env:GITHUB_OUTPUT
          "should_release=$($release.ShouldRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Verify central version source and existing tags
        if: steps.version.outputs.should_release == 'true'
        shell: pwsh
        run: ./scripts/verify-version.ps1 -Tag "v${{ steps.version.outputs.version }}"

  build-windows:
    name: Build Windows release
    runs-on: windows-latest
    needs: version
    if: needs.version.outputs.should_release == 'true'
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag_name }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare .NET
        uses: ./.github/actions/setup-dotnet

      - name: Install Restic
        uses: ./.github/actions/install-restic

      - name: Verify version and release inputs
        shell: pwsh
        run: ./scripts/verify-version.ps1 -Tag $env:RELEASE_TAG

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build and test
        uses: ./.github/actions/build-test

      - name: Publish Windows x64 executable
        shell: pwsh
        run: dotnet publish src/ResticBrowser/ResticBrowser.csproj -c Release -r win-x64 --self-contained true --no-restore -o publish

      - name: Prepare Windows release archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "windows-package" -Force | Out-Null
          Copy-Item "publish/ResticBrowser.exe","LICENSE","README.md" -Destination "windows-package"
          Compress-Archive -Path "windows-package/*" -DestinationPath "ResticBrowserWindows-${{ needs.version.outputs.version }}-win-x64.zip"

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          Copy-Item "publish/ResticBrowser.exe" -Destination "dist/ResticBrowser.exe"
          $isccPath = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $isccPath)) { $isccPath = Join-Path ${env:ProgramFiles} "Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $isccPath)) { $isccPath = "ISCC.exe" }
          & $isccPath "/DMyAppVersion=$env:RELEASE_VERSION" "installer/windows/ResticBrowser.iss"
          if (-not (Test-Path "dist/ResticBrowser-Setup.exe")) { throw "Installer 'dist/ResticBrowser-Setup.exe' was not created." }

      - name: Prepare release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "release-assets" -Force | Out-Null
          Copy-Item "publish/ResticBrowser.exe" -Destination "release-assets/ResticBrowser.exe"
          Copy-Item "ResticBrowserWindows-$env:RELEASE_VERSION-win-x64.zip" -Destination "release-assets"
          Copy-Item "dist/ResticBrowser-Setup.exe" -Destination "release-assets/ResticBrowser-Setup.exe"

      - name: Verify Windows release assets
        shell: pwsh
        run: ./scripts/verify-release-artifacts.ps1 -Directory release-assets -Version $env:RELEASE_VERSION -Platform Windows -RequireInstaller

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ needs.version.outputs.version }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Build Linux release
    runs-on: ubuntu-latest
    needs: version
    if: needs.version.outputs.should_release == 'true'
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag_name }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare .NET
        uses: ./.github/actions/setup-dotnet

      - name: Install Linux desktop dependencies
        shell: bash
        timeout-minutes: 5
        run: bash ./scripts/install-linux-ci-dependencies.sh

      - name: Install Restic
        uses: ./.github/actions/install-restic

      - name: Verify version and release inputs
        shell: pwsh
        run: ./scripts/verify-version.ps1 -Tag $env:RELEASE_TAG

      - name: Build and test
        uses: ./.github/actions/build-test

      - name: Publish Linux x64 executable and package tarball
        shell: bash
        run: |
          set -euo pipefail
          chmod 755 ./scripts/publish-linux.sh
          ./scripts/publish-linux.sh Release
          test -f "dist/ResticBrowser-linux-x64.tar.gz"
          tar -tzf "dist/ResticBrowser-linux-x64.tar.gz" | grep -Fx 'ResticBrowser'
          tar -tzf "dist/ResticBrowser-linux-x64.tar.gz" | grep -Fx 'LICENSE'
          tar -tzf "dist/ResticBrowser-linux-x64.tar.gz" | grep -Fx 'README.md'
          tar -tzf "dist/ResticBrowser-linux-x64.tar.gz" | grep -Fx 'tools/restic'
          mkdir -p "linux-assets"
          cp "dist/ResticBrowser-linux-x64.tar.gz" "linux-assets/"

      - name: Verify Linux release assets
        shell: pwsh
        run: ./scripts/verify-release-artifacts.ps1 -Directory linux-assets -Version $env:RELEASE_VERSION -Platform Linux

      - name: Smoke-test portable Linux release on Ubuntu
        shell: bash
        run: bash ./scripts/verify-linux-package.sh dist/ResticBrowser-linux-x64.tar.gz

      - name: Smoke-test the same release on current Arch Linux
        shell: bash
        timeout-minutes: 10
        run: bash ./scripts/verify-arch-linux-package.sh dist/ResticBrowser-linux-x64.tar.gz

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-${{ needs.version.outputs.version }}
          path: linux-assets/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Tag and publish release
    needs: [version, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.version.outputs.tag_name }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download Windows release assets
        uses: actions/download-artifact@v4
        with:
          name: windows-release-${{ needs.version.outputs.version }}
          path: release-assets

      - name: Download Linux release assets
        uses: actions/download-artifact@v4
        with:
          name: linux-release-${{ needs.version.outputs.version }}
          path: release-assets

      - name: Create checksums and verify complete local asset set
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath "release-assets" -File | Sort-Object Name | ForEach-Object {
              "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content -LiteralPath "release-assets/SHA256SUMS.txt" -Encoding utf8
          ./scripts/verify-release-artifacts.ps1 -Directory release-assets -Version $env:RELEASE_VERSION -Platform All -AllowChecksumFile -SkipWindowsExecutableVersionCheck

      - name: Verify existing release assets before tag creation
        shell: pwsh
        run: ./scripts/verify-remote-release.ps1 -Tag $env:RELEASE_TAG -Directory release-assets -AllowMissingRelease -AllowMissingAssets

      - name: Create or verify exact release tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "$RELEASE_TAG^{commit}")"
            if [ "$tag_sha" != "$RELEASE_SHA" ]; then
              echo "Tag $RELEASE_TAG zeigt auf $tag_sha statt auf $RELEASE_SHA." >&2
              exit 1
            fi
            echo "Tag $RELEASE_TAG zeigt bereits auf den geprüften Merge-Commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$RELEASE_TAG" "$RELEASE_SHA" --message "Restic Browser $RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi

      - name: Create or resume published GitHub release
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets 2>/dev/null || true)"
          if [ -z "$release_json" ]; then
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Restic Browser $RELEASE_TAG" \
              --generate-notes \
              --latest
            exit 0
          fi

          tag_name="$(printf '%s' "$release_json" | jq -r '.tagName')"
          is_draft="$(printf '%s' "$release_json" | jq -r '.isDraft')"
          is_prerelease="$(printf '%s' "$release_json" | jq -r '.isPrerelease')"
          if [ "$tag_name" != "$RELEASE_TAG" ]; then
            echo "Der vorhandene Release gehört zu $tag_name statt zu $RELEASE_TAG." >&2
            exit 1
          fi
          if [ "$is_prerelease" = "true" ]; then
            echo "Der vorhandene Release $RELEASE_TAG ist unerwartet ein Pre-Release." >&2
            exit 1
          fi

          mapfile -t existing_assets < <(printf '%s' "$release_json" | jq -r '.assets[].name')
          for asset in release-assets/*; do
            asset_name="$(basename "$asset")"
            if printf '%s\n' "${existing_assets[@]}" | grep -Fqx "$asset_name"; then
              echo "Remote-Asset $asset_name existiert bereits und wird nicht überschrieben."
            else
              gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
            fi
          done

          if [ "$is_draft" = "true" ]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          else
            echo "Der Release $RELEASE_TAG ist bereits veröffentlicht; er wird nicht überschrieben."
          fi

      - name: Verify published release asset hashes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/verify-remote-release.ps1 -Tag $env:RELEASE_TAG -Directory release-assets -RequirePublished
