name: Release

# Manuell starten: Actions → Release → "Run workflow" (Branch: main), ohne Eingaben.
# Die Version ist die zentrale `version` aus Cargo.toml des aktuellen main-Stands (im PR erhöht).
# Der Workflow ändert nichts an main und legt keinen PR an. Er prüft den erfolgreichen
# Build (CI) genau dieses Commits, nimmt die dort gebauten Pakete (kein Neubau), legt den
# annotierten Tag und ein Release als Entwurf an, hängt die Dateien an und veröffentlicht erst danach.
# Wiederholung mit derselben Version und demselben Commit ist unschädlich.
run-name: Release ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Version und Build prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      commit: ${{ steps.check.outputs.commit }}
      run_id: ${{ steps.check.outputs.run_id }}
      already: ${{ steps.check.outputs.already }}
    steps:
      - name: Nur manuell auf main ausführen
        run: |
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Release nur über „Run workflow“ mit Branch main starten."; exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; echo "## Release abgebrochen: $1 Es wurde nichts veröffentlicht." >> "$GITHUB_STEP_SUMMARY"; exit 1; }

          COMMIT=$(git rev-parse HEAD)
          [ "$COMMIT" = "$(git rev-parse origin/main)" ] || fail "main steht nicht mehr auf $COMMIT; den Release neu starten."

          # Version, Cargo.lock, Installer und Workspace-Crates prüft das zentrale Skript
          VERSION=$(python3 scripts/verify-version.py | sed -n 's/.*: //p')
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || fail "Ungültige Version „$VERSION“ in Cargo.toml (erwartet X.Y.Z)."
          python3 scripts/verify-version.py --tag "v$VERSION" >/dev/null || fail "Versionsprüfung für v$VERSION fehlgeschlagen."

          # Schon veröffentlicht? Gleiche Version + gleicher Commit = nichts zu tun, anderer Commit = Fehler
          TAG_COMMIT=$(git rev-parse -q --verify "refs/tags/v$VERSION^{commit}" || true)
          ALREADY=false
          if [ -n "$TAG_COMMIT" ]; then
            [ "$TAG_COMMIT" = "$COMMIT" ] || fail "Tag v$VERSION zeigt auf $TAG_COMMIT, nicht auf $COMMIT."
            DRAFT=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
            if [ "$DRAFT" = false ]; then ALREADY=true; fi
          fi

          # Erfolgreicher Build für genau diesen Commit auf main (Push oder manueller Lauf)
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --commit "$COMMIT" --branch main --status success \
            --json databaseId,event --limit 30 --jq '[.[] | select(.event == "push" or .event == "workflow_dispatch")][0].databaseId // empty')
          if [ -z "$RUN_ID" ] && [ "$ALREADY" != true ]; then
            fail "Für $COMMIT gibt es keinen erfolgreichen Build auf main (reine Doku-Änderungen lösen keinen aus: dann Actions → CI → Run workflow auf main starten)."
          fi

          {
            echo "version=$VERSION"
            echo "commit=$COMMIT"
            echo "run_id=$RUN_ID"
            echo "already=$ALREADY"
          } >> "$GITHUB_OUTPUT"
          if [ "$ALREADY" = true ]; then
            echo "## v$VERSION ist für $COMMIT schon veröffentlicht – nichts zu tun." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Prüfung bestanden: v$VERSION, Commit $COMMIT, Build-Lauf $RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    name: Release veröffentlichen
    needs: prepare
    if: needs.prepare.outputs.already != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v${{ needs.prepare.outputs.version }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_SHA: ${{ needs.prepare.outputs.commit }}
      RUN_ID: ${{ needs.prepare.outputs.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0

      - name: Gebaute Pakete aus dem geprüften Build holen
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'release-*' --dir "$RUNNER_TEMP/dl"
          mkdir release-assets
          find "$RUNNER_TEMP/dl" -type f -exec cp {} release-assets/ \;
          (cd release-assets && sha256sum -- * | sed 's/ \*/  /' > "$RUNNER_TEMP/SHA256SUMS.txt")
          cp "$RUNNER_TEMP/SHA256SUMS.txt" release-assets/SHA256SUMS.txt
          ls -l release-assets

      - name: Vollständigkeit und Versionen der Pakete prüfen
        shell: pwsh
        run: ./scripts/verify-release-artifacts.ps1 -Directory release-assets -Version $env:RELEASE_VERSION -Platform All -AllowChecksumFile -SkipWindowsExecutableVersionCheck

      - name: Vorhandenen Release vor dem Tag prüfen
        shell: pwsh
        run: ./scripts/verify-remote-release.ps1 -Tag $env:RELEASE_TAG -Directory release-assets -AllowMissingRelease -AllowMissingAssets

      - name: Annotierten Tag anlegen oder prüfen
        run: |
          set -euo pipefail
          git fetch origin --tags
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "$RELEASE_TAG^{commit}")"
            if [ "$tag_sha" != "$RELEASE_SHA" ]; then
              echo "Tag $RELEASE_TAG zeigt auf $tag_sha statt auf $RELEASE_SHA." >&2
              exit 1
            fi
            echo "Tag $RELEASE_TAG zeigt bereits auf den geprüften Commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$RELEASE_TAG" "$RELEASE_SHA" --message "Restic Browser $RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi

      - name: Entwurf anlegen, fehlende Dateien anhängen, prüfen
        run: |
          set -euo pipefail
          release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets 2>/dev/null || true)"
          if [ -z "$release_json" ]; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "Restic Browser $RELEASE_TAG" --generate-notes --latest=false
            release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets)"
          fi
          [ "$(printf '%s' "$release_json" | jq -r '.tagName')" = "$RELEASE_TAG" ] || { echo "::error::Release gehört zu einem anderen Tag."; exit 1; }
          [ "$(printf '%s' "$release_json" | jq -r '.isPrerelease')" != true ] || { echo "::error::Release ist unerwartet ein Pre-Release."; exit 1; }
          [ "$(printf '%s' "$release_json" | jq -r '.isDraft')" = true ] || { echo "::error::Release $RELEASE_TAG ist schon veröffentlicht, aber nicht als abgeschlossen erkannt."; exit 1; }

          mapfile -t existing < <(printf '%s' "$release_json" | jq -r '.assets[].name')
          for asset in release-assets/*; do
            name="$(basename "$asset")"
            if printf '%s\n' "${existing[@]:-}" | grep -Fqx "$name"; then
              echo "Asset $name existiert bereits und wird nicht überschrieben."
            else
              gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
            fi
          done
          n=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
          [ "$n" -eq "$(ls release-assets | wc -l)" ] || { echo "::error::Es sind $n statt $(ls release-assets | wc -l) Dateien am Release."; exit 1; }

      - name: Entwurf gegen die geprüften Dateien vergleichen
        shell: pwsh
        run: ./scripts/verify-remote-release.ps1 -Tag $env:RELEASE_TAG -Directory release-assets

      - name: Veröffentlichen
        run: |
          set -euo pipefail
          # „Neueste“ wird nur verschoben, wenn diese Version die höchste veröffentlichte ist
          highest=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,isPrerelease \
            --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' | sed 's/^v//' | sort -V | tail -1)
          if [ -z "$highest" ] || [ "$(printf '%s\n%s\n' "$highest" "$RELEASE_VERSION" | sort -V | tail -1)" = "$RELEASE_VERSION" ]; then latest=true; else latest=false; fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest="$latest"

      - name: Veröffentlichte Dateien erneut herunterladen und vergleichen
        shell: pwsh
        run: |
          ./scripts/verify-remote-release.ps1 -Tag $env:RELEASE_TAG -Directory release-assets -RequirePublished
          "## Veröffentlicht: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/tag/$env:RELEASE_TAG" | Add-Content $env:GITHUB_STEP_SUMMARY
