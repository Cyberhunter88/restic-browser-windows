name: Build, sign and release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  version:
    name: Read and validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - id: version
        name: Read version
        shell: pwsh
        run: |
          $project = [xml](Get-Content "src/ResticBrowser/ResticBrowser.csproj")
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Project version '$version' is not semantic MAJOR.MINOR.PATCH." }
          if ($env:GITHUB_REF_TYPE -eq "tag") {
              if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag '$env:GITHUB_REF_NAME' does not match project version 'v$version'." }
              git fetch origin main
              git merge-base --is-ancestor HEAD FETCH_HEAD
              if ($LASTEXITCODE -ne 0) { throw "Release is only allowed for commits on the main branch." }
          }
          "version=$version" >> $env:GITHUB_OUTPUT

  build-windows:
    name: Build Windows release
    runs-on: windows-latest
    needs: version
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore NuGet package cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.sln', '**/*.slnx', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore ResticBrowser.slnx

      - name: Install Restic for integration tests
        shell: pwsh
        run: |
          $version = "0.19.1"
          $asset = "restic_${version}_windows_amd64.zip"
          $root = Join-Path $env:RUNNER_TEMP "restic"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Invoke-WebRequest -Uri "https://github.com/restic/restic/releases/download/v$version/$asset" -OutFile (Join-Path $root $asset)
          Invoke-WebRequest -Uri "https://github.com/restic/restic/releases/download/v$version/SHA256SUMS" -OutFile (Join-Path $root "SHA256SUMS")
          $expected = (((Select-String -Path (Join-Path $root "SHA256SUMS") -Pattern ([regex]::Escape($asset)) | Select-Object -First 1).Line) -split '\s+')[0]
          $actual = (Get-FileHash (Join-Path $root $asset) -Algorithm SHA256).Hash
          if (-not $expected -or $actual -ne $expected) { throw "Restic archive checksum verification failed." }
          Expand-Archive -LiteralPath (Join-Path $root $asset) -DestinationPath $root -Force
          Copy-Item (Join-Path $root "restic_${version}_windows_amd64.exe") (Join-Path $root "restic.exe")
          $root | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build release
        shell: pwsh
        run: dotnet build ResticBrowser.slnx -c Release --no-restore

      - name: Run tests
        shell: pwsh
        run: dotnet run --project tests/ResticBrowser.Tests/ResticBrowser.Tests.csproj -c Release --no-build

      - name: Publish Windows x64 executable
        shell: pwsh
        run: dotnet publish src/ResticBrowser/ResticBrowser.csproj -c Release -r win-x64 --self-contained true --no-restore -o publish

      - name: Prepare unsigned release artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "unsigned-package" -Force | Out-Null
          Copy-Item "publish/ResticBrowser.exe","LICENSE","README.md" -Destination "unsigned-package"
          Compress-Archive -Path "unsigned-package/*" -DestinationPath "ResticBrowserWindows-${{ needs.version.outputs.version }}-win-x64.zip"

      - name: Upload unsigned artifact
        id: upload_unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-release-${{ needs.version.outputs.version }}
          path: ResticBrowserWindows-${{ needs.version.outputs.version }}-win-x64.zip
          if-no-files-found: error
          retention-days: 7

      - name: Check SignPath configuration
        id: signpath_check
        shell: pwsh
        run: |
          $hasToken = -not [string]::IsNullOrWhiteSpace("${{ secrets.SIGNPATH_API_TOKEN }}")
          $hasOrg = -not [string]::IsNullOrWhiteSpace("${{ vars.SIGNPATH_ORGANIZATION_ID }}")
          $hasProject = -not [string]::IsNullOrWhiteSpace("${{ vars.SIGNPATH_PROJECT_SLUG }}")
          $hasPolicy = -not [string]::IsNullOrWhiteSpace("${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}")
          $hasArtifactCfg = -not [string]::IsNullOrWhiteSpace("${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}")
          if ($hasToken -and $hasOrg -and $hasProject -and $hasPolicy -and $hasArtifactCfg) {
              "enabled=true" >> $env:GITHUB_OUTPUT
          } else {
              "enabled=false" >> $env:GITHUB_OUTPUT
              Write-Host "SignPath credentials or configuration are not fully configured. Proceeding with standard release build."
          }

      - name: Submit signing request
        if: steps.signpath_check.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload_unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
          skip-decompress: true

      - name: Verify signed executable
        if: steps.signpath_check.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $archive = Get-Item "signed/ResticBrowserWindows-${{ needs.version.outputs.version }}-win-x64.zip" -ErrorAction Stop
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath "signed-package"
          $file = Get-Item "signed-package/ResticBrowser.exe" -ErrorAction Stop
          $signature = Get-AuthenticodeSignature $file.FullName
          Write-Host "$($file.FullName) - $($signature.Status)"
          if ($signature.Status -ne "Valid") { throw "Invalid Authenticode signature for $($file.FullName) ($($signature.Status))" }

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          if ("${{ steps.signpath_check.outputs.enabled }}" -eq "true") {
              Copy-Item "signed-package/ResticBrowser.exe" -Destination "dist/ResticBrowser.exe"
          } else {
              Copy-Item "publish/ResticBrowser.exe" -Destination "dist/ResticBrowser.exe"
          }
          $isccPath = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $isccPath)) { $isccPath = Join-Path ${env:ProgramFiles} "Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $isccPath)) { $isccPath = "ISCC.exe" }
          & $isccPath "/DMyAppVersion=${{ needs.version.outputs.version }}" "installer/windows/ResticBrowser.iss"
          if (-not (Test-Path "dist/ResticBrowser-Setup.exe")) { throw "Installer 'dist/ResticBrowser-Setup.exe' was not created." }

      - name: Prepare signed release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "release-assets" -Force | Out-Null
          if ("${{ steps.signpath_check.outputs.enabled }}" -eq "true") {
              Copy-Item "signed-package/ResticBrowser.exe" -Destination "release-assets/ResticBrowser.exe"
              Copy-Item "signed/ResticBrowserWindows-${{ needs.version.outputs.version }}-win-x64.zip" -Destination "release-assets"
          } else {
              Copy-Item "publish/ResticBrowser.exe" -Destination "release-assets/ResticBrowser.exe"
              Copy-Item "ResticBrowserWindows-${{ needs.version.outputs.version }}-win-x64.zip" -Destination "release-assets"
          }
          Copy-Item "dist/ResticBrowser-Setup.exe" -Destination "release-assets/ResticBrowser-Setup.exe"

      - name: Upload signed release assets
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-${{ needs.version.outputs.version }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Build Linux release
    runs-on: ubuntu-latest
    needs: version
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore NuGet package cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.sln', '**/*.slnx', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore ResticBrowser.slnx

      - name: Install Restic for integration tests
        shell: pwsh
        run: |
          $version = "0.19.1"
          $asset = "restic_${version}_linux_amd64.bz2"
          $root = Join-Path $env:RUNNER_TEMP "restic"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Invoke-WebRequest -Uri "https://github.com/restic/restic/releases/download/v$version/$asset" -OutFile (Join-Path $root $asset)
          Invoke-WebRequest -Uri "https://github.com/restic/restic/releases/download/v$version/SHA256SUMS" -OutFile (Join-Path $root "SHA256SUMS")
          $expected = (((Select-String -Path (Join-Path $root "SHA256SUMS") -Pattern ([regex]::Escape($asset)) | Select-Object -First 1).Line) -split '\s+')[0]
          $actual = (Get-FileHash (Join-Path $root $asset) -Algorithm SHA256).Hash
          if (-not $expected -or $actual -ne $expected) { throw "Restic archive checksum verification failed." }
          bzip2 -d (Join-Path $root $asset)
          Copy-Item (Join-Path $root "restic_${version}_linux_amd64") (Join-Path $root "restic")
          chmod +x (Join-Path $root "restic")
          $root | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build release
        shell: pwsh
        run: dotnet build ResticBrowser.slnx -c Release --no-restore

      - name: Run tests
        shell: pwsh
        run: dotnet run --project tests/ResticBrowser.Tests/ResticBrowser.Tests.csproj -c Release --no-build

      - name: Publish Linux x64 executable and package tarball
        shell: pwsh
        run: |
          chmod +x ./scripts/publish-linux.sh
          ./scripts/publish-linux.sh Release
          if (-not (Test-Path "dist/ResticBrowser-linux-x64.tar.gz")) { throw "Linux package 'dist/ResticBrowser-linux-x64.tar.gz' was not created." }
          New-Item -ItemType Directory -Path "linux-assets" -Force | Out-Null
          Copy-Item "dist/ResticBrowser-linux-x64.tar.gz" -Destination "linux-assets"

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-${{ needs.version.outputs.version }}
          path: linux-assets/*
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The unsigned artifact is only the SignPath input.  It deliberately is
      # not downloaded here, so it can never overwrite the signed/fallback ZIP.
      - name: Download Windows release assets
        uses: actions/download-artifact@v4
        with:
          pattern: "signed-release-*"
          path: release-assets
          merge-multiple: true

      - name: Download Linux release assets
        uses: actions/download-artifact@v4
        with:
          pattern: "linux-release-*"
          path: release-assets
          merge-multiple: true

      - name: Record release asset hashes
        shell: pwsh
        run: Get-ChildItem "release-assets" -File | ForEach-Object { "$($_.Name)=$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)" } | Set-Content "release-assets.sha256"

      - name: Publish signed GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          make_latest: true

      - name: Verify published release asset hashes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path "verified-release" -Force | Out-Null
          gh release download $env:GITHUB_REF_NAME --dir "verified-release" --pattern "ResticBrowser.exe" --pattern "ResticBrowserWindows-*.zip" --pattern "ResticBrowser-Setup.exe" --pattern "ResticBrowser-linux-x64.tar.gz" --clobber
          $expected = @{}
          Get-Content "release-assets.sha256" | ForEach-Object { $name,$hash = $_ -split "=",2; $expected[$name] = $hash }
          $mismatch = $false
          Get-ChildItem "verified-release" -File | ForEach-Object {
              $actual = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
              if ($actual -ne $expected[$_.Name]) {
                  Write-Host "HASH MISMATCH: $($_.Name)" -ForegroundColor Red
                  $mismatch = $true
              } else {
                  Write-Host "$($_.Name): OK"
              }
          }
          if ($mismatch) { throw "One or more published release asset hashes do not match." }
          Write-Host "All published release assets verified successfully."
