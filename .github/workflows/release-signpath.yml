name: Release (SignPath & GitHub)

on:
  push:
    tags:
      - 'v*'

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Publish Windows Release
        run: ./scripts/publish-windows.ps1
      
      - name: Submit to SignPath for signing
        uses: SignPath/github-action@v0.13
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: restic-browser
          signing-policy-slug: release-signing
          github-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-configuration-slug: windows-exe
          input-artifact-path: dist/ResticBrowser.exe
          output-artifact-path: dist/ResticBrowser.exe
          wait-for-completion: true
      
      - name: Build Windows Installer
        run: ./scripts/publish-windows-installer.ps1
      
      - name: Calculate SHA-256 Checksums
        run: |
          $files = @(
            'dist/ResticBrowser.exe',
            'dist/ResticBrowser-Setup.exe'
          )
          $checksums = @()
          foreach ($file in $files) {
            if (Test-Path $file) {
              $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash
              $filename = Split-Path -Leaf $file
              $checksums += "$hash  $filename"
            }
          }
          $checksums | Out-File -FilePath 'dist/SHA256.txt' -Encoding UTF8
      
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/ResticBrowser.exe
            dist/ResticBrowser-Setup.exe
            dist/SHA256.txt

  release-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Publish Linux Release
        run: bash ./scripts/publish-linux.sh
      
      - name: Calculate SHA-256 Checksums
        run: |
          cd dist
          sha256sum ResticBrowser-linux-x64.tar.gz > SHA256-linux.txt
      
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            dist/ResticBrowser-linux-x64.tar.gz
            dist/SHA256-linux.txt

  github-release:
    needs: [release-windows, release-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      
      - name: Merge SHA-256 checksums
        run: |
          cat artifacts/windows-release/SHA256.txt artifacts/linux-release/SHA256-linux.txt > SHA256.txt
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-release/ResticBrowser.exe
            artifacts/windows-release/ResticBrowser-Setup.exe
            artifacts/linux-release/ResticBrowser-linux-x64.tar.gz
            SHA256.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
