name: Build, sign and release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: read

jobs:
  build-and-sign:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Read and validate version
        id: version
        shell: pwsh
        run: $project = [xml](Get-Content "src/ResticBrowser/ResticBrowser.csproj"); $version = [string]$project.Project.PropertyGroup.Version; if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Project version '$version' is not semantic MAJOR.MINOR.PATCH." }; if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") { throw "Tag '$env:GITHUB_REF_NAME' does not match project version 'v$version'." }; if ((git rev-parse HEAD) -ne (git rev-parse origin/main)) { throw "Signing is allowed only for the current main commit." }; "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore ResticBrowser.slnx

      - name: Install Restic for integration tests
        shell: pwsh
        run: winget install --id Restic.Restic --exact --source winget --silent --accept-package-agreements --accept-source-agreements

      - name: Build release
        shell: pwsh
        run: dotnet build ResticBrowser.slnx -c Release --no-restore

      - name: Run tests
        shell: pwsh
        run: dotnet run --project tests/ResticBrowser.Tests/ResticBrowser.Tests.csproj -c Release --no-build

      - name: Publish Windows x64 executable
        shell: pwsh
        run: dotnet publish src/ResticBrowser/ResticBrowser.csproj -c Release -r win-x64 --self-contained true --no-restore -o publish

      - name: Prepare unsigned release artifact
        shell: pwsh
        run: New-Item -ItemType Directory -Path "unsigned-package" -Force | Out-Null; Copy-Item "publish/ResticBrowser.exe","LICENSE","README.md" -Destination "unsigned-package"; Compress-Archive -Path "unsigned-package/*" -DestinationPath "ResticBrowserWindows-${{ steps.version.outputs.version }}-win-x64.zip"

      - name: Upload unsigned artifact
        id: upload_unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-release-${{ steps.version.outputs.version }}
          path: ResticBrowserWindows-${{ steps.version.outputs.version }}-win-x64.zip
          if-no-files-found: error
          retention-days: 7

      - name: Submit signing request
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload_unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
          skip-decompress: true

      - name: Verify signed executable
        shell: pwsh
        run: $archive = Get-Item "signed/ResticBrowserWindows-${{ steps.version.outputs.version }}-win-x64.zip" -ErrorAction Stop; Expand-Archive -LiteralPath $archive.FullName -DestinationPath "signed-package"; $file = Get-Item "signed-package/ResticBrowser.exe" -ErrorAction Stop; $signature = Get-AuthenticodeSignature $file.FullName; Write-Host "$($file.FullName) - $($signature.Status)"; if ($signature.Status -ne "Valid") { throw "Invalid Authenticode signature for $($file.FullName) ($($signature.Status))" }

      - name: Prepare signed release assets
        shell: pwsh
        run: New-Item -ItemType Directory -Path "release-assets" -Force | Out-Null; Copy-Item "signed-package/ResticBrowser.exe" -Destination "release-assets/ResticBrowser.exe"; Copy-Item "signed/ResticBrowserWindows-${{ steps.version.outputs.version }}-win-x64.zip" -Destination "release-assets"

      - name: Upload signed release assets
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-${{ steps.version.outputs.version }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-and-sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download signed release assets
        uses: actions/download-artifact@v4
        with:
          pattern: signed-release-*
          path: release-assets
          merge-multiple: true

      - name: Record release asset hashes
        shell: pwsh
        run: Get-ChildItem "release-assets" -File | ForEach-Object { "$($_.Name)=$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)" } | Set-Content "release-assets.sha256"

      - name: Publish signed GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Verify published release asset hashes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: New-Item -ItemType Directory -Path "verified-release" -Force | Out-Null; gh release download $env:GITHUB_REF_NAME --dir "verified-release" --pattern "ResticBrowser.exe" --pattern "ResticBrowserWindows-*.zip" --clobber; $expected = @{}; Get-Content "release-assets.sha256" | ForEach-Object { $name,$hash = $_ -split "=",2; $expected[$name] = $hash }; Get-ChildItem "verified-release" -File | ForEach-Object { $actual = (Get-FileHash $_.FullName -Algorithm SHA256).Hash; if ($actual -ne $expected[$_.Name]) { throw "Published asset hash mismatch for $($_.Name)." } }; if ((Get-ChildItem "verified-release" -File).Count -ne $expected.Count) { throw "Published release asset count does not match." }
