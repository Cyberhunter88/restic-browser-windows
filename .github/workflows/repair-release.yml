name: Manual release repair

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Vorhandener Release-Tag, zum Beispiel v0.3.4"
        required: true
        type: string
      publish:
        description: "Nach erfolgreicher Prüfung den Release veröffentlichen"
        required: true
        default: false
        type: boolean

concurrency:
  group: manual-release-repair-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      version: ${{ steps.validate.outputs.version }}
    env:
      REPAIR_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Checkout requested release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Check tag format and main ancestry
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REPAIR_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main --tags
          tag_sha="$(git rev-list -n 1 "$REPAIR_TAG")"
          git merge-base --is-ancestor "$tag_sha" origin/main
          version="${REPAIR_TAG#v}"
          {
            echo "tag=$REPAIR_TAG"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Verify source version and tag
        shell: pwsh
        run: ./scripts/verify-version.ps1 -Tag $env:REPAIR_TAG

  build-windows:
    name: Rebuild Windows release
    needs: validate
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore NuGet package cache
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.sln', '**/*.slnx', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore ResticBrowser.slnx

      - name: Check tag and version
        shell: pwsh
        run: ./scripts/verify-version.ps1 -Tag $env:RELEASE_TAG

      - name: Check translation resources
        shell: pwsh
        run: ./scripts/verify-translations.ps1

      - name: Check formatting and package vulnerabilities
        shell: pwsh
        run: |
          dotnet format --verify-no-changes
          dotnet list ResticBrowser.slnx package --vulnerable --include-transitive

      - name: Typecheck and run all tests
        shell: pwsh
        run: |
          dotnet build ResticBrowser.slnx -c Release --no-restore
          dotnet run --project tests/ResticBrowser.Tests/ResticBrowser.Tests.csproj -c Release --no-build

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Rebuild portable executable and installer
        shell: pwsh
        run: ./scripts/publish-windows-installer.ps1 -Configuration Release

      - name: Prepare complete Windows repair assets
        shell: pwsh
        run: |
          $package = "windows-package"
          $assets = "release-assets"
          New-Item -ItemType Directory -Path $package,$assets -Force | Out-Null
          Copy-Item -LiteralPath "dist/ResticBrowser.exe" -Destination $package
          Copy-Item -LiteralPath "LICENSE","README.md" -Destination $package
          Compress-Archive -Path "$package/*" -DestinationPath "$assets/ResticBrowserWindows-$env:RELEASE_VERSION-win-x64.zip" -CompressionLevel Optimal
          Copy-Item -LiteralPath "dist/ResticBrowser.exe","dist/ResticBrowser-Setup.exe" -Destination $assets

      - name: Verify Windows repair assets
        shell: pwsh
        run: |
          ./scripts/verify-version.ps1 -Tag $env:RELEASE_TAG -ExecutablePath "release-assets/ResticBrowser.exe"
          ./scripts/verify-release-artifacts.ps1 -Directory release-assets -Version $env:RELEASE_VERSION -Platform Windows -RequireInstaller

      - name: Upload verified Windows repair assets
        uses: actions/upload-artifact@v4
        with:
          name: repair-windows-${{ needs.validate.outputs.version }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Rebuild Linux release
    needs: validate
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore NuGet package cache
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.sln', '**/*.slnx', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore ResticBrowser.slnx

      - name: Install Linux desktop dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y bzip2 libegl1 libgbm1 libgl1 libgl1-mesa-dri libinput10 xvfb

      - name: Install Restic for integration tests
        shell: pwsh
        run: |
          $version = "0.19.1"
          $asset = "restic_${version}_linux_amd64.bz2"
          $root = Join-Path $env:RUNNER_TEMP "restic"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Invoke-WebRequest -Uri "https://github.com/restic/restic/releases/download/v$version/$asset" -OutFile (Join-Path $root $asset)
          Invoke-WebRequest -Uri "https://github.com/restic/restic/releases/download/v$version/SHA256SUMS" -OutFile (Join-Path $root "SHA256SUMS")
          $expected = (((Select-String -Path (Join-Path $root "SHA256SUMS") -Pattern ([regex]::Escape($asset)) | Select-Object -First 1).Line) -split '\s+')[0]
          $actual = (Get-FileHash (Join-Path $root $asset) -Algorithm SHA256).Hash
          if (-not $expected -or $actual -ne $expected) { throw "Restic archive checksum verification failed." }
          bzip2 -d (Join-Path $root $asset)
          Copy-Item (Join-Path $root "restic_${version}_linux_amd64") (Join-Path $root "restic")
          chmod +x (Join-Path $root "restic")
          $root | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check tag and version
        shell: pwsh
        run: ./scripts/verify-version.ps1 -Tag $env:RELEASE_TAG

      - name: Check translation resources
        shell: pwsh
        run: ./scripts/verify-translations.ps1

      - name: Check formatting and package vulnerabilities
        shell: pwsh
        run: |
          dotnet format --verify-no-changes
          dotnet list ResticBrowser.slnx package --vulnerable --include-transitive

      - name: Typecheck and run all tests
        shell: pwsh
        run: |
          dotnet build ResticBrowser.slnx -c Release --no-restore
          dotnet run --project tests/ResticBrowser.Tests/ResticBrowser.Tests.csproj -c Release --no-build

      - name: Rebuild complete Linux tarball
        shell: bash
        run: |
          set -euo pipefail
          chmod 755 ./scripts/publish-linux.sh
          ./scripts/publish-linux.sh Release
          mkdir -p release-assets
          cp dist/ResticBrowser-linux-x64.tar.gz release-assets/

      - name: Verify Linux repair assets and GUI startup
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -File ./scripts/verify-release-artifacts.ps1 \
            -Directory release-assets -Version "$RELEASE_VERSION" -Platform Linux
          extracted="$(mktemp -d)"
          trap 'rm -rf "$extracted"' EXIT
          tar -xzf dist/ResticBrowser-linux-x64.tar.gz -C "$extracted"
          test -x "$extracted/ResticBrowser"
          set +e
          timeout --signal=TERM --kill-after=5s 15s \
            xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            "$extracted/ResticBrowser" >"$extracted/startup.log" 2>&1
          exit_code=$?
          set -e
          if [ "$exit_code" -ne 124 ]; then
            cat "$extracted/startup.log"
            echo "Die Linux-Release-Anwendung ist beim GUI-Start unerwartet beendet worden (Exitcode $exit_code)." >&2
            exit 1
          fi

      - name: Upload verified Linux repair assets
        uses: actions/upload-artifact@v4
        with:
          name: repair-linux-${{ needs.validate.outputs.version }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  repair:
    name: Upload and optionally publish repaired release
    needs: [validate, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      PUBLISH: ${{ inputs.publish }}
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      - name: Download verified repair assets
        uses: actions/download-artifact@v4
        with:
          pattern: repair-*
          path: release-assets
          merge-multiple: true

      - name: Create and verify local release manifest
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath release-assets -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content -LiteralPath release-assets/SHA256SUMS.txt -Encoding utf8
          ./scripts/verify-release-artifacts.ps1 -Directory release-assets -Version $env:RELEASE_VERSION -Platform All -AllowChecksumFile

      - name: Ensure the tagged GitHub release exists as a draft when needed
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft --title "Restic Browser $RELEASE_TAG" --generate-notes
          fi

      - name: Upload all repaired assets
        shell: bash
        run: gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" release-assets/* --clobber

      - name: Verify exact remote assets before optional publication
        shell: pwsh
        run: ./scripts/verify-remote-release.ps1 -Tag $env:RELEASE_TAG -Directory release-assets

      - name: Publish only when explicitly requested
        if: inputs.publish == true
        shell: bash
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.id')"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true

      - name: Verify exact remote state after repair
        shell: pwsh
        run: |
          if ($env:PUBLISH -eq "true") {
              ./scripts/verify-remote-release.ps1 -Tag $env:RELEASE_TAG -Directory release-assets -RequirePublished
          } else {
              ./scripts/verify-remote-release.ps1 -Tag $env:RELEASE_TAG -Directory release-assets
          }
