name: Build and test

on:
  pull_request:
  push:
    branches:
      - main
    tags-ignore:
      - "**"

permissions:
  contents: read

jobs:
  matrix-build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Check C# code formatting
        shell: pwsh
        run: dotnet format --verify-no-changes

      - name: Check for package vulnerabilities
        shell: pwsh
        run: dotnet list package --vulnerable --include-transitive

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore ResticBrowser.slnx

      - name: Install Restic for integration tests
        shell: pwsh
        run: |
          $version = "0.19.1"
          $root = Join-Path $env:RUNNER_TEMP "restic"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          if ($IsWindows) {
              $asset = "restic_${version}_windows_amd64.zip"
              $binName = "restic.exe"
          } else {
              $asset = "restic_${version}_linux_amd64.bz2"
              $binName = "restic"
          }
          Invoke-WebRequest -Uri "https://github.com/restic/restic/releases/download/v$version/$asset" -OutFile (Join-Path $root $asset)
          Invoke-WebRequest -Uri "https://github.com/restic/restic/releases/download/v$version/SHA256SUMS" -OutFile (Join-Path $root "SHA256SUMS")
          $expected = (((Select-String -Path (Join-Path $root "SHA256SUMS") -Pattern ([regex]::Escape($asset)) | Select-Object -First 1).Line) -split '\s+')[0]
          $actual = (Get-FileHash (Join-Path $root $asset) -Algorithm SHA256).Hash
          if (-not $expected -or $actual -ne $expected) { throw "Restic archive checksum verification failed." }
          if ($IsWindows) {
              Expand-Archive -LiteralPath (Join-Path $root $asset) -DestinationPath $root -Force
              Copy-Item (Join-Path $root "restic_${version}_windows_amd64.exe") (Join-Path $root $binName)
          } else {
              bzip2 -d (Join-Path $root $asset)
              Copy-Item (Join-Path $root "restic_${version}_linux_amd64") (Join-Path $root $binName)
              chmod +x (Join-Path $root $binName)
          }
          $root | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build release
        shell: pwsh
        run: dotnet build ResticBrowser.slnx -c Release --no-restore

      - name: Run tests
        shell: pwsh
        run: dotnet run --project tests/ResticBrowser.Tests/ResticBrowser.Tests.csproj -c Release --no-build

      - name: Publish preview executable
        shell: pwsh
        run: |
          if ($IsWindows) {
              dotnet publish src/ResticBrowser/ResticBrowser.csproj -c Release -r win-x64 --self-contained true --no-restore -o publish-preview
              New-Item -ItemType Directory -Path "preview-artifact" -Force | Out-Null
              Copy-Item "publish-preview/ResticBrowser.exe","LICENSE","README.md" -Destination "preview-artifact"
              Compress-Archive -Path "preview-artifact/*" -DestinationPath "ResticBrowser-preview-win-x64.zip"
          } else {
              dotnet publish src/ResticBrowser/ResticBrowser.csproj -c Release -r linux-x64 --self-contained true --no-restore -o publish-preview
              chmod +x publish-preview/ResticBrowser
              tar -C publish-preview -czf ResticBrowser-preview-linux-x64.tar.gz ResticBrowser
          }

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.os }}
          path: |
            ResticBrowser-preview-win-x64.zip
            ResticBrowser-preview-linux-x64.tar.gz
          if-no-files-found: ignore
          retention-days: 7

  build-and-test:
    name: build-and-test
    needs: matrix-build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: All builds passed
        run: echo "All matrix builds succeeded!"
