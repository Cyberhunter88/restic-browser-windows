name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare .NET
        uses: ./.github/actions/setup-dotnet

      - name: Check C# code formatting
        shell: pwsh
        run: dotnet format --verify-no-changes

      - name: Check for package vulnerabilities
        shell: pwsh
        run: dotnet list package --vulnerable --include-transitive

      - name: Test Linux package verifier failure handling
        shell: bash
        run: python3 tests/scripts/test_linux_package.py

      - name: Check central version source
        shell: pwsh
        run: ./scripts/verify-version.ps1

  matrix-build-and-test:
    name: build-and-test (${{ matrix.os }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare .NET
        uses: ./.github/actions/setup-dotnet

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 5
        run: bash ./scripts/install-linux-ci-dependencies.sh

      - name: Install Restic
        uses: ./.github/actions/install-restic

      - name: Start isolated OpenSSH server for remote restore test
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo ssh-keygen -A
          sudo mkdir -p /run/sshd
          test_user="$(id -un)"
          test_password="restic-browser-ci-only"
          echo "$test_user:$test_password" | sudo chpasswd
          sshd_config="$RUNNER_TEMP/restic-browser-sshd_config"
          cat > "$sshd_config" <<EOF
          Port 22222
          ListenAddress 127.0.0.1
          HostKey /etc/ssh/ssh_host_ed25519_key
          PasswordAuthentication yes
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          PermitRootLogin no
          UsePAM no
          StrictModes no
          AllowUsers $test_user
          PidFile $RUNNER_TEMP/restic-browser-sshd.pid
          Subsystem sftp internal-sftp
          EOF
          sudo /usr/sbin/sshd -f "$sshd_config" -E "$RUNNER_TEMP/restic-browser-sshd.log"
          echo "RESTIC_BROWSER_SSH_E2E_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "RESTIC_BROWSER_SSH_E2E_PORT=22222" >> "$GITHUB_ENV"
          echo "RESTIC_BROWSER_SSH_E2E_USER=$test_user" >> "$GITHUB_ENV"
          echo "RESTIC_BROWSER_SSH_E2E_PASSWORD=$test_password" >> "$GITHUB_ENV"

      - name: Build and test
        uses: ./.github/actions/build-test

      - name: Publish preview executable
        if: runner.os == 'Linux' || github.event_name == 'pull_request'
        shell: pwsh
        run: |
          if ($IsWindows) {
              dotnet publish src/ResticBrowser/ResticBrowser.csproj -c Release -r win-x64 --self-contained true --no-restore -o publish-preview
              New-Item -ItemType Directory -Path "preview-artifact" -Force | Out-Null
              Copy-Item "publish-preview/ResticBrowser.exe","LICENSE","README.md" -Destination "preview-artifact"
              Compress-Archive -Path "preview-artifact/*" -DestinationPath "ResticBrowser-preview-win-x64.zip"
          } else {
              chmod +x ./scripts/publish-linux.sh
              ./scripts/publish-linux.sh Release
              Copy-Item "dist/ResticBrowser-linux-x64.tar.gz" -Destination "ResticBrowser-preview-linux-x64.tar.gz"
          }

      - name: Validate portable Linux package on Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: bash ./scripts/verify-linux-package.sh dist/ResticBrowser-linux-x64.tar.gz

      - name: Validate the same portable package on current Arch Linux
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 10
        run: bash ./scripts/verify-arch-linux-package.sh dist/ResticBrowser-linux-x64.tar.gz

      - name: Upload preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.os }}
          path: |
            ResticBrowser-preview-win-x64.zip
            ResticBrowser-preview-linux-x64.tar.gz
          if-no-files-found: ignore
          retention-days: 7

  build-and-test:
    name: build-and-test
    needs: matrix-build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: All builds passed
        run: echo "All matrix builds succeeded!"
