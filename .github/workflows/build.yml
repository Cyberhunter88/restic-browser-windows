name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare Rust
        uses: ./.github/actions/setup-rust
        with:
          tools: cargo-audit cargo-deny

      - name: Check formatting
        shell: bash
        working-directory: rust
        run: cargo fmt --check

      - name: Clippy
        shell: bash
        working-directory: rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check licenses
        shell: bash
        working-directory: rust
        run: cargo deny check licenses

      - name: Check known vulnerabilities
        shell: bash
        working-directory: rust
        run: cargo audit

      - name: Test Linux package verifier failure handling
        shell: bash
        run: python3 tests/scripts/test_linux_package.py

      - name: Check release workflow scenarios
        shell: bash
        run: python3 -m unittest discover -s tests/scripts -p test_release_flow.py

      - name: Check central version source
        shell: bash
        run: python3 scripts/verify-version.py

  matrix-build-and-test:
    name: build-and-test (${{ matrix.os }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare Rust
        uses: ./.github/actions/setup-rust

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 5
        run: bash ./scripts/install-linux-ci-dependencies.sh

      - name: Install Restic
        uses: ./.github/actions/install-restic

      - name: Build and test
        uses: ./.github/actions/build-test

      - name: Check start in both themes under Xvfb
        if: runner.os == 'Linux'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/ui-check"; mkdir -p "$work/src" "$work/xdg"
          echo Test > "$work/src/datei.txt"
          export RESTIC_PASSWORD=ci-test RESTIC_REPOSITORY="$work/repo"
          "$RESTIC_BROWSER_TEST_RESTIC" init >/dev/null
          "$RESTIC_BROWSER_TEST_RESTIC" backup "$work/src" --host ci >/dev/null
          cd rust
          cargo build --locked -p restic-ui
          for scale in 1 1.5 2; do
            for theme in "" "--dev-dark"; do
              XDG_SESSION_TYPE=x11 WINIT_X11_SCALE_FACTOR="$scale" XDG_DATA_HOME="$work/xdg" \
                RESTIC_BROWSER_DEV_PASSWORD=ci-test RESTIC_BROWSER_TEST_RESTIC="$RESTIC_BROWSER_TEST_RESTIC" \
                xvfb-run --auto-servernum --server-args="-screen 0 3200x2200x24" \
                target/debug/restic-browser --dev-settings "$work/s.json" --dev-repo "$work/repo" $theme \
                --dev-screenshot "$work/ui-$scale${theme:+-dunkel}.png"
            done
          done

      - name: Upload layout captures
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v7
        with:
          name: layout-captures
          compression-level: 0
          path: ${{ runner.temp }}/ui-check/*.png
          if-no-files-found: ignore

      - name: Build Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: sh rust/scripts/package-linux.sh

      - name: Validate portable Linux package on Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: bash ./scripts/verify-linux-package.sh dist-rust/ResticBrowser-linux-x64.tar.gz

      - name: Validate the same portable package on current Arch Linux
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 10
        run: bash ./scripts/verify-arch-linux-package.sh dist-rust/ResticBrowser-linux-x64.tar.gz

      - name: Build Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./rust/scripts/package-windows.ps1

      - name: Check Windows executable version
        if: runner.os == 'Windows'
        shell: bash
        run: python scripts/verify-version.py --executable dist-rust/ResticBrowser.exe

      - name: Prepare preview artifacts
        shell: bash
        run: |
          mkdir -p preview
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist-rust/ResticBrowserWindows-*-win-x64.zip preview/ResticBrowser-preview-win-x64.zip
          else
            cp dist-rust/ResticBrowser-linux-x64.tar.gz preview/ResticBrowser-preview-linux-x64.tar.gz
          fi

      - name: Upload preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: preview-${{ matrix.os }}
          compression-level: 0
          path: preview/*
          if-no-files-found: error
          retention-days: 7

  build-and-test:
    name: build-and-test
    needs: [preflight, matrix-build-and-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All builds passed
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          BUILD_RESULT: ${{ needs.matrix-build-and-test.result }}
        run: test "$PREFLIGHT_RESULT" = success && test "$BUILD_RESULT" = success
