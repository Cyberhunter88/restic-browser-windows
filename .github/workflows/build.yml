name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Check code formatting
        run: dotnet format --verify-no-changes
      
      - name: Check vulnerable packages
        run: dotnet list package --vulnerable --include-transitive
      
      - name: Build solution
        run: dotnet build ResticBrowser.slnx -c Release
      
      - name: Run integration tests
        run: dotnet run --project tests/ResticBrowser.Tests/ResticBrowser.Tests.csproj -c Release --no-build
      
  installer-test:
    needs: build
    runs-on: windows-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Publish Windows Release
        run: ./scripts/publish-windows.ps1
      
      - name: Build Windows Installer
        run: ./scripts/publish-windows-installer.ps1
      
      - name: Test Installer
        run: ./scripts/installer-test.ps1
      
      - name: Upload installer test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-test-results
          path: |
            dist/*
          if-no-files-found: ignore
