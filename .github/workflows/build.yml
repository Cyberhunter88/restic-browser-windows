name: CI

# Ein Build pro Änderung:
# - Pull Requests werden immer gebaut (auch reine Doku-Änderungen), weil main die Prüfung
#   „build-and-test“ verlangt; sie erzeugen nur kurzlebige Vorschau-Artefakte.
# - main wird nach dem Merge einmal gebaut. Dieser Lauf erzeugt die Release-Pakete
#   (Artefakte `release-*`, 90 Tage), die der Workflow „Release“ unverändert veröffentlicht.
# - Reine Doku-Änderungen auf main lösen keinen Build aus; für einen solchen Commit den
#   Workflow manuell auf main starten (workflow_dispatch).
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore: ["**.md", ".githooks/**"]
  workflow_dispatch:

# Neuere Läufe eines Pull Requests ersetzen ältere. Läufe auf main werden nie abgebrochen, weil
# der Release-Workflow die dort gebauten Pakete unverändert veröffentlicht.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare Rust
        uses: ./.github/actions/setup-rust
        with:
          tools: cargo-audit cargo-deny

      - name: Check formatting
        shell: bash
        run: cargo fmt --check

      - name: Clippy
        shell: bash
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check licenses
        shell: bash
        run: cargo deny check licenses

      - name: Check known vulnerabilities
        shell: bash
        run: cargo audit

      - name: Test Linux package verifier failure handling
        shell: bash
        run: python3 tests/scripts/test_linux_package.py

      - name: Check central version source
        shell: bash
        run: python3 scripts/verify-version.py

  matrix-build-and-test:
    name: build-and-test (${{ matrix.os }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare Rust
        uses: ./.github/actions/setup-rust

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 30
        run: bash ./scripts/install-linux-ci-dependencies.sh

      - name: Install Restic
        uses: ./.github/actions/install-restic

      - name: Build and test
        uses: ./.github/actions/build-test

      - name: Check start in both themes under Xvfb
        if: runner.os == 'Linux'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/ui-check"; mkdir -p "$work/src" "$work/xdg"
          echo Test > "$work/src/datei.txt"
          export RESTIC_PASSWORD=ci-test RESTIC_REPOSITORY="$work/repo"
          "$RESTIC_BROWSER_TEST_RESTIC" init >/dev/null
          "$RESTIC_BROWSER_TEST_RESTIC" backup "$work/src" --host ci >/dev/null
          cargo build --locked -p restic-ui
          for scale in 1 1.5 2; do
            for theme in "" "--dev-dark"; do
              PATH="$(dirname "$RESTIC_BROWSER_TEST_RESTIC"):$PATH" XDG_SESSION_TYPE=x11 \
                WINIT_X11_SCALE_FACTOR="$scale" XDG_DATA_HOME="$work/xdg" RESTIC_BROWSER_DEV_PASSWORD=ci-test \
                xvfb-run --auto-servernum --server-args="-screen 0 3200x2200x24" \
                target/debug/restic-browser --dev-settings "$work/s.json" --dev-repo "$work/repo" $theme \
                --dev-screenshot "$work/ui-$scale${theme:+-dunkel}.png"
            done
          done

      - name: Upload layout captures
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v7
        with:
          name: layout-captures
          compression-level: 0
          path: ${{ runner.temp }}/ui-check/*.png
          if-no-files-found: ignore

      - name: Build Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: sh scripts/package-linux.sh

      - name: Validate portable Linux package on Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: bash ./scripts/verify-linux-package.sh dist-rust/ResticBrowser-linux-x64.tar.gz

      - name: Validate the same portable package on current Arch Linux
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 10
        run: bash ./scripts/verify-arch-linux-package.sh dist-rust/ResticBrowser-linux-x64.tar.gz

      - name: Install Inno Setup
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') { ./scripts/package-windows.ps1 }
          else { ./scripts/package-windows.ps1 -Installer }

      - name: Check Windows executable version
        if: runner.os == 'Windows'
        shell: bash
        run: python scripts/verify-version.py --executable dist-rust/ResticBrowser.exe

      - name: Prepare Windows release assets
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $version = (& ./scripts/get-product-version.ps1).Trim()
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Copy-Item dist-rust/ResticBrowser.exe release-assets/ResticBrowser.exe
          Copy-Item "dist-rust/ResticBrowserWindows-$version-win-x64.zip" release-assets
          Copy-Item dist-rust/ResticBrowser-Setup.exe release-assets/ResticBrowser-Setup.exe
          ./scripts/verify-release-artifacts.ps1 -Directory release-assets -Version $version -Platform Windows -RequireInstaller

      - name: Prepare Linux release assets
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          archive="dist-rust/ResticBrowser-linux-x64.tar.gz"
          for entry in ResticBrowser LICENSE README.md THIRD-PARTY.md install-desktop-entry.sh share/ResticBrowser.desktop share/ResticBrowser.png tools/restic; do
            tar -tzf "$archive" | grep -Fx "$entry"
          done
          mkdir -p release-assets
          cp "$archive" release-assets/
          version="$(pwsh -NoProfile -File ./scripts/get-product-version.ps1)"
          pwsh -NoProfile -File ./scripts/verify-release-artifacts.ps1 -Directory release-assets -Version "$version" -Platform Linux

      - name: Upload release artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          compression-level: 0
          path: release-assets/*
          if-no-files-found: error
          retention-days: 90

      - name: Prepare preview artifacts
        shell: bash
        run: |
          mkdir -p preview
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist-rust/ResticBrowserWindows-*-win-x64.zip preview/ResticBrowser-preview-win-x64.zip
          else
            cp dist-rust/ResticBrowser-linux-x64.tar.gz preview/ResticBrowser-preview-linux-x64.tar.gz
          fi

      - name: Upload preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: preview-${{ matrix.os }}
          compression-level: 0
          path: preview/*
          if-no-files-found: error
          retention-days: 7

  build-and-test:
    name: build-and-test
    needs: [preflight, matrix-build-and-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All builds passed
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          BUILD_RESULT: ${{ needs.matrix-build-and-test.result }}
        run: test "$PREFLIGHT_RESULT" = success && test "$BUILD_RESULT" = success
